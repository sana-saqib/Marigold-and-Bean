<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aboutTitle">
  <title id="aboutTitle">Illustration of the Marigold and Bean storefront</title>
  <rect x="0" y="0" width="560" height="400" fill="#F0E4CE" rx="18"/>

  <!-- sky/back wall -->
  <rect x="40" y="40" width="480" height="220" fill="#FAF3E8"/>

  <!-- awning -->
  <path d="M 40 100 L 520 100 L 500 60 L 60 60 Z" fill="#C7873B" stroke="#3C2A21" stroke-width="5" stroke-linejoin="round"/>
  <g fill="#3C2A21">
    <rect x="60" y="60" width="30" height="40"/>
    <rect x="120" y="60" width="30" height="40"/>
    <rect x="180" y="60" width="30" height="40"/>
    <rect x="240" y="60" width="30" height="40"/>
    <rect x="300" y="60" width="30" height="40"/>
    <rect x="360" y="60" width="30" height="40"/>
    <rect x="420" y="60" width="30" height="40"/>
    <rect x="480" y="60" width="20" height="40"/>
  </g>

  <!-- storefront window frame -->
  <rect x="70" y="110" width="180" height="130" fill="#FFFFFF" stroke="#3C2A21" stroke-width="6"/>
  <line x1="160" y1="110" x2="160" y2="240" stroke="#3C2A21" stroke-width="4"/>
  <line x1="70" y1="175" x2="250" y2="175" stroke="#3C2A21" stroke-width="4"/>

  <!-- door -->
  <rect x="260" y="110" width="90" height="150" fill="#7A8B6F" stroke="#3C2A21" stroke-width="6"/>
  <circle cx="335" cy="185" r="5" fill="#3C2A21"/>

  <!-- second window -->
  <rect x="370" y="110" width="120" height="130" fill="#FFFFFF" stroke="#3C2A21" stroke-width="6"/>
  <line x1="430" y1="110" x2="430" y2="240" stroke="#3C2A21" stroke-width="4"/>

  <!-- signage board -->
  <rect x="150" y="30" width="260" height="34" rx="6" fill="#3C2A21"/>
  <text x="280" y="53" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#FAF3E8">Marigold &amp; Bean</text>

  <!-- hanging plant -->
  <path d="M 480 100 L 480 130" stroke="#3C2A21" stroke-width="3"/>
  <path d="M 460 130 C 460 150 500 150 500 130 C 500 120 460 120 460 130 Z" fill="#7A8B6F"/>

  <!-- sidewalk -->
  <rect x="0" y="260" width="560" height="140" fill="#E9DFCF"/>
  <line x1="0" y1="260" x2="560" y2="260" stroke="#C7873B" stroke-width="4" opacity="0.6"/>

  <!-- sidewalk chalkboard sign -->
  <g transform="translate(90 270)">
    <path d="M0 90 L18 0 L54 0 L72 90 Z" fill="#3C2A21"/>
    <path d="M10 82 L24 10 L48 10 L62 82 Z" fill="#5a4636"/>
    <text x="36" y="45" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#FAF3E8">Open</text>
    <text x="36" y="60" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#FAF3E8">Daily</text>
  </g>

  <!-- small potted plants either side of door -->
  <g transform="translate(240 232)">
    <rect x="0" y="10" width="18" height="16" fill="#C7873B"/>
    <circle cx="9" cy="0" r="12" fill="#7A8B6F"/>
  </g>
  <g transform="translate(352 232)">
    <rect x="0" y="10" width="18" height="16" fill="#C7873B"/>
    <circle cx="9" cy="0" r="12" fill="#7A8B6F"/>
  </g>

  <!-- two small figures walking by -->
  <g transform="translate(430 300)">
    <circle cx="0" cy="0" r="10" fill="#E7A2A2"/>
    <rect x="-8" y="10" width="16" height="34" rx="8" fill="#3C2A21"/>
  </g>
  <g transform="translate(465 305)">
    <circle cx="0" cy="0" r="9" fill="#C7873B"/>
    <rect x="-7" y="9" width="14" height="30" rx="7" fill="#7A8B6F"/>
  </g>
</svg>
